<title>Orion Team-dle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: party-formation strip, a stage bar, then one guessing column per hidden slot. */
:root {
  --bg: #eef1f6;
  --panel: #ffffff;
  --ink: #18223a;
  --muted: #5b6680;
  --line: #d3d9e6;
  --gold: #a87a12;
  --gold-soft: #f3e7c6;
  --holly: #b3263a;
  --hit: #2f8a4c;
  --near: #c9971a;
  --miss: #77819a;
  --chip-hit: #d9efe0;
  --chip-hit-ink: #1d6a37;
  --chip-miss: #e7eaf1;
  --chip-miss-ink: #5b6680;
  --font-display: "Cinzel", "Trajan Pro", Georgia, serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1324; --panel: #151d33; --ink: #e6eaf4; --muted: #9aa4be; --line: #2a3553;
  --gold: #e3b54a; --gold-soft: #3a3016; --holly: #e0566a;
  --hit: #3fae63; --near: #d9a92a; --miss: #4b5573;
  --chip-hit: #1c3a28; --chip-hit-ink: #8fdcaa; --chip-miss: #1f2840; --chip-miss-ink: #9aa4be;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1324; --panel: #151d33; --ink: #e6eaf4; --muted: #9aa4be; --line: #2a3553;
  --gold: #e3b54a; --gold-soft: #3a3016; --holly: #e0566a;
  --hit: #3fae63; --near: #d9a92a; --miss: #4b5573;
  --chip-hit: #1c3a28; --chip-hit-ink: #8fdcaa; --chip-miss: #1f2840; --chip-miss-ink: #9aa4be;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; display: grid; gap: 26px; }
header { display: grid; gap: 6px; }
.eyebrow { font: 600 12px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--holly); }
h1 { font: 800 clamp(28px, 6vw, 44px)/1.05 var(--font-display); margin: 0; letter-spacing: .02em; text-wrap: balance; }
h1 span { color: var(--gold); }
.lede { margin: 0; color: var(--muted); max-width: 66ch; }
h2 { font: 600 14px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; margin: 0; color: var(--muted); }
.section { display: grid; gap: 14px; }

.quest { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 12px; }
.q-head { display: grid; gap: 2px; }
.q-name { font: 600 19px/1.25 var(--font-display); text-wrap: balance; }
.q-meta { font-size: 13px; color: var(--muted); }
.q-notes { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.q-notes li { font-size: 13px; font-weight: 600; background: var(--gold-soft); border-radius: 6px; padding: 3px 8px; }
.waves { display: grid; grid-template-columns: repeat(var(--waves, 3), minmax(0, 1fr)); gap: 10px; }
.wave { border-top: 2px solid var(--line); padding-top: 8px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.wave-h { display: flex; justify-content: space-between; gap: 8px; font: 600 12px/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.wave-h span:last-child { font-family: var(--font-mono); letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
.enemy { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; font-size: 13.5px; }
.enemy.has-sprite { grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; }
.enemy.has-sprite .e-sprite { grid-row: 1 / span 2; width: 44px; height: 44px; border-radius: 8px; background: var(--bg); box-shadow: 0 0 0 1px var(--line); }
.enemy.has-sprite .e-cls { grid-column: 2 / -1; }
.enemy .e-name { overflow-wrap: anywhere; }
.enemy .e-hp { font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; }
.enemy .e-cls { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.formation { display: grid; grid-template-columns: repeat(var(--units, 4), minmax(0, 1fr)); gap: 10px; }
.slot { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.slot .tag { font: 600 11px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.slot.backline { border-style: dashed; }
.slot.support .tag { color: var(--gold); }
.slot.fixed { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.slot .name { font: 600 17px/1.2 var(--font-display); overflow-wrap: anywhere; }
.slot .name.q { color: var(--muted); font-size: 24px; }
.facts { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.facts dd.q { color: var(--muted); font-weight: 400; }
.facts dd.won { color: var(--hit); }
.facts dd.lost { color: var(--holly); }
.extra { margin: 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--muted); display: grid; gap: 1px; border-top: 1px solid var(--line); padding-top: 6px; }
.mc { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); }
.mc b { color: var(--ink); font-weight: 600; }

.steps { display: grid; grid-template-columns: repeat(var(--stages, 3), minmax(0, 1fr)); gap: 8px; }
.step { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; color: var(--ink); font: inherit; cursor: pointer; }
.step .s-n { font: 500 12px var(--font-mono); color: var(--muted); }
.step .s-t { font: 600 15px/1.2 var(--font-display); }
.step .s-st { font-size: 12.5px; color: var(--muted); }
.step[aria-current="step"] { border-color: var(--holly); box-shadow: inset 0 0 0 1px var(--holly); }
.step.done .s-st { color: var(--hit); }
.step:disabled { cursor: not-allowed; opacity: .55; }
.step:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.cols { display: grid; grid-template-columns: repeat(var(--hidden, 3), minmax(0, 1fr)); gap: 14px; align-items: start; }
.col { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.col.won { border-color: var(--hit); }
.col.lost { border-color: var(--holly); }
.col-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.col-head .who { order: 3; flex-basis: 100%; }
.col-head h3 { margin: 0; font: 600 16px/1.2 var(--font-display); }
.col-head .who { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.col-head .left { margin-left: auto; font: 500 13px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pips { display: flex; gap: 4px; }
.pip { width: 100%; height: 5px; border-radius: 3px; background: var(--line); }
.pip.hit { background: var(--hit); } .pip.near { background: var(--near); } .pip.miss { background: var(--miss); }
.entry { display: flex; gap: 8px; position: relative; }
.entry input { flex: 1; min-width: 0; font: 15px var(--font-body); padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.entry input:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.list { position: absolute; top: 100%; left: 0; right: 0; z-index: 5; margin: 4px 0 0; padding: 4px; list-style: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; max-height: 260px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.list li { padding: 5px 9px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.list li small { color: var(--muted); white-space: nowrap; }
.list li.used { opacity: .5; }
.list li[aria-selected="true"], .list li:hover { background: var(--gold-soft); }
.np-pick { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.np-pick button { padding: 10px 0; font: 600 15px var(--font-mono); background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.np-pick button:hover:not(:disabled) { border-color: var(--gold); }
button { font: 700 14px var(--font-body); padding: 9px 14px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
button.primary { background: var(--holly); color: #fff; }
button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
button:disabled { opacity: .4; cursor: not-allowed; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.msg { color: var(--holly); font-size: 13px; }
.msg:empty { display: none; }
.outcome { font-size: 14px; font-weight: 600; }
.outcome.won { color: var(--hit); } .outcome.lost { color: var(--holly); }
.history { display: grid; gap: 8px; }
.tile { border-radius: 10px; padding: 9px 11px; display: grid; gap: 7px; color: #fff; min-width: 0; animation: flip .35s ease both; }
.tile.hit { background: var(--hit); }
.tile.near { background: var(--near); color: #1d1606; }
.tile.miss { background: var(--miss); }
.tile .t-top { display: flex; gap: 8px; align-items: center; }
.tile .t-name { font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.tile .t-n { margin-left: auto; font: 500 12px var(--font-mono); opacity: .85; }
.tile .t-verdict { font-size: 12px; opacity: .9; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font: 600 11.5px/1 var(--font-body); padding: 4px 6px; border-radius: 4px; background: var(--chip-miss); color: var(--chip-miss-ink); white-space: nowrap; }
.chip.y { background: var(--chip-hit); color: var(--chip-hit-ink); }
.empty { color: var(--muted); font-size: 13px; border: 1px dashed var(--line); border-radius: 10px; padding: 12px; }
@keyframes flip { from { transform: rotateX(70deg); opacity: .2; } to { transform: none; opacity: 1; } }

.key { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.banner { background: var(--gold-soft); border-radius: 10px; padding: 10px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; font-weight: 600; }
.result { background: var(--panel); border: 1px solid var(--gold); border-radius: 12px; padding: 18px; display: grid; gap: 12px; }
.result h3 { margin: 0; font: 800 22px/1.2 var(--font-display); }
.result pre { margin: 0; font: 500 14px/1.45 var(--font-mono); background: var(--bg); padding: 12px; border-radius: 8px; overflow-x: auto; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.note { color: var(--muted); font-size: 14px; }
footer { font-size: 12px; color: var(--muted); }

/* Banded CE stage: one row per pool CE, one button per level band. */
.cb-pick { display: grid; gap: 8px; }
.cols.wide { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.cb-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.cb-row .who { grid-column: 1 / -1; font-size: 12.5px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.cb-row .who small { color: var(--muted); font-weight: 400; }
.cb-row button { display: grid; gap: 1px; padding: 5px 0; font: 600 11.5px/1.1 var(--font-mono); background: var(--bg); color: var(--ink); border: 1px solid var(--line); white-space: nowrap; }
.cb-row button small { font: 600 9.5px/1 var(--font-body); color: var(--muted); letter-spacing: .02em; }
.cb-row button:hover:not(:disabled) { border-color: var(--gold); }

/* Route stage: one wide card per wave. */
.cols.one { grid-template-columns: minmax(0, 1fr); }
.seq { display: flex; flex-wrap: wrap; gap: 4px; }
.act { font: 600 12.5px/1.2 var(--font-body); padding: 6px 8px; border-radius: 6px; color: #fff; display: inline-flex; align-items: baseline; gap: 5px; border: 1px solid transparent; }
.act .n { font: 500 10.5px var(--font-mono); opacity: .8; }
.act.hit { background: var(--hit); }
.act.near { background: var(--near); color: #1d1606; }
.act.miss { background: var(--miss); }
.act.other { background: var(--miss); border: 2px dashed var(--near); }
.act.blank { background: transparent; border: 1px dashed var(--line); color: var(--muted); min-width: 44px; justify-content: center; }
button.act.fill { background: var(--gold-soft); color: var(--ink); border-color: var(--gold); font-weight: 600; padding: 6px 8px; }
.seq.history-row { animation: flip .35s ease both; }
.r-label { font: 600 12px/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pal { display: grid; gap: 6px; }
.pal-row { display: grid; grid-template-columns: 120px repeat(4, minmax(0, 1fr)); gap: 6px; }
.pal-row .who { font-weight: 600; font-size: 13px; align-self: center; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; }
.pal button { display: grid; gap: 1px; text-align: left; padding: 6px 8px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); font: 700 13px/1.2 var(--font-body); min-width: 0; }
.pal button small { font: 400 11.5px/1.25 var(--font-body); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal button:hover:not(:disabled) { border-color: var(--gold); }
.pal button.hit { box-shadow: inset 4px 0 0 var(--hit); }
.pal button.near { box-shadow: inset 4px 0 0 var(--near); }
.pal button.miss, .pal button.other { opacity: .5; }
.pal button.locked { opacity: .45; border-style: dashed; background: transparent; }
.pal button.locked small { font-style: italic; }
.pal .spacer { visibility: hidden; }
.pal button.has-ico { grid-template-columns: 28px minmax(0, 1fr); column-gap: 7px; align-items: center; }
.pal button.has-ico .p-ico { grid-row: 1 / span 2; }
.pal button.has-ico small { grid-column: 2; }
.p-ico { width: 28px; height: 28px; border-radius: 4px; object-fit: contain; }
.pal button.locked .p-ico { filter: grayscale(1); }
.t-ico { width: 18px; height: 18px; border-radius: 3px; object-fit: contain; align-self: center; margin-block: -2px; }
@media (max-width: 600px) { .pal button.has-ico { grid-template-columns: minmax(0, 1fr); } .pal button.has-ico .p-ico { grid-row: auto; width: 24px; height: 24px; } .pal button.has-ico small { grid-column: 1; } }
.r-ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.r-note { margin: 0; font-size: 13.5px; color: var(--muted); }
@media (max-width: 600px) { .pal-row { grid-template-columns: repeat(4, minmax(0, 1fr)); } .pal-row .who { grid-column: 1 / -1; } }

@media (max-width: 820px) {
  .waves { grid-template-columns: minmax(0, 1fr); }
  .formation { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 480px) { .steps { gap: 6px; } .step { padding: 8px; } .step .s-st { font-size: 11.5px; } }
@media (prefers-reduced-motion: reduce) { .tile { animation: none; } }
/* Servant faces: one sprite, positioned per servant. The build appends the sprite rule below. */
.face { flex: none; display: inline-grid; place-items: center; width: var(--s); height: var(--s); border-radius: calc(var(--s) / 6); background-repeat: no-repeat; background-size: calc(var(--fcols, 24) * var(--s)) auto; background-position: calc(var(--fx, 0) * var(--s) * -1) calc(var(--fy, 0) * var(--s) * -1); box-shadow: 0 0 0 1px var(--line); }
.face.q, .face.none { background-image: none; background-color: var(--bg); border: 1px dashed var(--line); box-shadow: none; color: var(--muted); font: 600 calc(var(--s) * .42)/1 var(--font-display); }
.who-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.li-main { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ce-ico { position: relative; flex: none; display: inline-block; width: var(--s); height: var(--s); }
.ce-ico img { display: block; width: 100%; height: 100%; border-radius: 4px; box-shadow: 0 0 0 1px var(--line); }
.ce-ico.mlb::after { content: "★"; position: absolute; right: -4px; bottom: -5px; font-size: calc(var(--s) * .5); line-height: 1; color: #ffd84a; text-shadow: 0 0 2px #3a2a00, 0 0 2px #3a2a00, 0 1px 1px #000; }
/* In a narrow party card the text drops below the icon instead of squeezing beside it. */
.ce-dd { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.ce-dd > span:not(.ce-ico) { flex: 1 1 90px; min-width: 0; }
.formation .who-row { flex-wrap: wrap; gap: 6px 10px; }
.formation .who-row .name { flex: 1 1 96px; min-width: 0; overflow-wrap: break-word; hyphens: auto; }
.cb-row .who { display: flex; align-items: center; gap: 7px; }
.mlb-star { color: #d99a0f; margin-right: 1px; }
.sound-btn { font-size: 13px; padding: 6px 12px; margin-top: 4px; }
/* Animated battle-sprite "profile" (head and shoulders) in place of the face icon; a reveal pops in. */
.sprite-head { flex: none; width: 64px; height: 64px; border-radius: 11px; background: var(--bg); box-shadow: 0 0 0 1px var(--line); object-fit: cover; }
.sprite-head.pop { animation: summon .8s cubic-bezier(.2, 1.3, .4, 1) both; }
@keyframes summon { 0% { transform: translateY(18px) scale(.6); opacity: 0; filter: brightness(2.6) saturate(.4); } 55% { opacity: 1; } 100% { transform: none; filter: none; } }
@media (prefers-reduced-motion: reduce) { .sprite-head.pop { animation: none; } }
/* Hints */
.pip.hint { background: var(--gold); }
.hints { display: flex; flex-wrap: wrap; gap: 4px; }
.hint-chip { font-size: 12.5px; background: var(--gold-soft); border-radius: 6px; padding: 3px 8px; }
.hint-btn { justify-self: start; font-size: 12.5px; padding: 5px 10px; }
/* Pinned strip: enemies of the wave in view (skill-order stage) */
.dk-wave { border-bottom: 1px solid var(--line); }
.dk-wave[hidden] { display: none; }
.dkw-inner { max-width: 1040px; margin: 0 auto; padding: 5px 16px; display: flex; align-items: center; gap: 12px; }
.dkw-label { flex: none; display: grid; font: 600 12px/1.15 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--holly); }
.dkw-label small { font: 500 11px var(--font-mono); letter-spacing: 0; text-transform: none; color: var(--muted); }
.dkw-list { display: flex; flex-wrap: wrap; gap: 4px 10px; min-width: 0; }
.dkw-e { display: flex; align-items: center; gap: 5px; min-width: 0; }
.dkw-e img, .dkw-ph { width: 32px; height: 32px; border-radius: 6px; background: var(--bg); box-shadow: 0 0 0 1px var(--line); flex: none; }
.dkw-txt { display: grid; line-height: 1.1; }
.dkw-name { font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.dkw-hp { font: 500 10.5px var(--font-mono); color: var(--muted); }
@media (max-width: 600px) { .dkw-inner { padding: 4px 8px; gap: 8px; } .dkw-name { display: none; } .dkw-e { flex-direction: column; gap: 1px; } .dkw-txt { text-align: center; } }
/* Line-up sequence on a finished wave card, and the front/back divider */
.lu-seq { display: grid; gap: 2px; justify-items: start; }
.lu { display: flex; align-items: center; gap: 4px; }
.lu-u { display: inline-grid; border-radius: 7px; transition: box-shadow .2s; }
.lu-u .lu-img, .lu-u .face { width: 30px; height: 30px; border-radius: 6px; background: var(--bg); box-shadow: 0 0 0 1px var(--line); }
.lu-u.moved { box-shadow: 0 0 0 2px var(--gold); animation: lu-pop .5s ease both; }
.lu-sep { width: 2px; height: 26px; margin: 0 4px; border-radius: 1px; background: var(--line); }
.lu-step { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); padding-left: 8px; }
.lu-arrow { font-size: 15px; color: var(--gold); }
@keyframes lu-pop { from { transform: scale(.8); } to { transform: none; } }
.dk-sep { flex: none; align-self: stretch; width: 2px; border-radius: 1px; background: var(--line); }
/* Pinned team strip */
.dock { position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); box-shadow: 0 6px 18px rgba(0,0,0,.12); animation: dock-in .2s ease both; }
.dock[hidden] { display: none; }
.dk-row { max-width: 1040px; margin: 0 auto; padding: 6px 16px; display: flex; gap: 6px; }
.dk-row > .dk { flex: 1 1 0; }
.dk { display: grid; grid-template-columns: 40px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 6px; align-items: center; min-width: 0; }
.dk .dk-img, .dk .face { grid-row: 1 / span 2; width: 40px; height: 40px; border-radius: 8px; background: var(--bg); box-shadow: 0 0 0 1px var(--line); }
.dk-q { display: grid; place-items: center; color: var(--muted); font: 600 16px var(--font-display); border: 1px dashed var(--line); box-shadow: none !important; }

    },
    np: {
      title: "NP Levels", unit: "NP level", pool: null, input: "np", near: false,
      key: `<span><i class="sw" style="background:var(--hit)"></i>Right NP level</span><span><i class="sw" style="background:var(--miss)"></i>Wrong</span><span>▲ means the real NP level is higher, ▼ lower.</span>`,
      chips: () => "",
      missLabel: "Wrong",
    },
    route: {
      title: "Skill Order", unit: "wave", pool: null, input: "route", near: false,
      key: `<span><i class="sw" style="background:var(--hit)"></i>Right action, valid order</span><span><i class="sw" style="background:var(--near)"></i>Used this wave, but out of order</span><span><i class="sw" style="background:var(--miss)"></i>Not used this wave</span><span><i class="sw" style="background:var(--miss);outline:2px dashed var(--near);outline-offset:-2px"></i>Used in a different wave</span><span>Any order that works counts: skills go before NPs, and NPs must be in the right chain order.</span>`,
      chips: () => "",
      missLabel: "Not quite",
    },
  };
  // Banded CE stage: answers are ce*10 + band, bands being quarters of the rarity's max level.
  // Keep CE_MAX in step with build-game.js.
  // Band 1 is "Not MLB" with no range (non-MLB caps vary). Bands 2-5 are the quarters 1-4, MLB.
  const CE_MAX = { 3: 60, 4: 80, 5: 100 };
  const QUARTER = [0, 0, 1, 2, 3, 4];
  const bandRange = (no, b) => { const q = CE_MAX[CE.get(no).rar] / 4, r = QUARTER[b]; return [r === 1 ? 1 : (r - 1) * q + 1, r * q]; };
  const bandTag = b => b === 1 ? "not MLB" : "MLB";
  const bandText = (no, b) => { if (b === 1) return "Not MLB"; const [a, z] = bandRange(no, b); return `Lv${a}–${z} · MLB`; };
  const BANDED = {
    input: "ceband", pool: null, near: true, missLabel: "Not this one",
    key: `<span><i class="sw" style="background:var(--hit)"></i>Right CE and level range</span><span><i class="sw" style="background:var(--near)"></i>That exact CE and range is on another slot</span><span><i class="sw" style="background:var(--miss)"></i>Not this one</span><span>Only the event CEs are in play. Pick "Not MLB" (any level), or an MLB level range: quarters of the CE's max level (60 for 3★, 80 for 4★, 100 for 5★). Chips: green matches; ▲/▼ means the answer's rarity or level is higher or lower.</span>`,
    chips: (g, a) => {
      const gc = Math.floor(g / 10), ac = Math.floor(a / 10), gb = g % 10, ab = a % 10, G = CE.get(gc), A = CE.get(ac);
      const lvl = gb === ab ? (ab === 1 ? "Not MLB, right" : "Level right")
        : ab === 1 ? "It's not MLB" : gb === 1 ? "It's MLB"
        : `Level${cmp(gb, ab, " ▲ higher", " ▼ lower")}`;
      return chip(gc === ac, gc === ac ? "Right CE" : `${G.rar}★${cmp(G.rar, A.rar, "▲", "▼")}`) + chip(gb === ab, lvl);
    },
  };
  let slotStage = 0;
  const STAGES = CFG.stages.map(s => {
    if (s.kind === "route") return { ...KINDS.route, kind: "route", max: s.tries, cols: RT.waves.length, ans: [] };
    const ans = FLAT.slice(slotStage * N, slotStage * N + N); slotStage++;
    const base = s.kind === "ce" && s.pool ? { ...KINDS.ce, ...BANDED, cePool: s.pool } : KINDS[s.kind];
    return { ...base, kind: s.kind, max: s.tries, cols: N, ans };
  });
  const ceNo = v => STAGES.find(s => s.kind === "ce")?.input === "ceband" ? Math.floor(v / 10) : v;
  const COLS = st => [...Array(STAGES[st].cols).keys()];
  const stageOf = kind => STAGES.findIndex(s => s.kind === kind);
  const SERV = stageOf("servant"), CES = stageOf("ce"), NPS = stageOf("np"), ROUTE = stageOf("route");

  // ---- route grading ----
  const actWho = c => Math.floor(c / 10) === 9 ? "MC" : RT.units[Math.floor(c / 10)].nick;
  const actKey = c => c % 10 === 4 ? "NP" : `S${c % 10}`;
  const actLabel = c => `${actWho(c)} ${actKey(c)}`;
  const actIcon = c => { const u = Math.floor(c / 10), a = c % 10; return (a === 4 ? RT.npIcon : u === 9 ? RT.mc.icons?.[a - 1] : RT.units[u].icons?.[a - 1]) || ""; };
  const iconImg = (c, cls) => actIcon(c) ? `<img class="${cls}" src="${actIcon(c)}" alt="" width="28" height="28" decoding="async">` : "";
  const actName = c => { const u = Math.floor(c / 10), a = c % 10; return u === 9 ? RT.mc.skills[a - 1] : a === 4 ? RT.units[u].np : RT.units[u].skills[a - 1]; };
  const grade = (w, g) => {
    const W = RT.waves[w], pos = new Map(g.map((c, k) => [c, k]));
    return g.map(c => {
      if (!W.set.includes(c)) return RT.waves.some((o, j) => j !== w && o.set.includes(c)) ? "other" : "miss";
      return W.before.every(([a, b]) => (a !== c && b !== c) || (pos.has(a) && pos.has(b) && pos.get(a) < pos.get(b))) ? "hit" : "near";
    });
  };
  const solvedBy = (w, g) => g.length === RT.waves[w].set.length && grade(w, g).every(v => v === "hit");
  // Cooldown lock: a skill an earlier, finished wave used is on cooldown later. NPs and route.reusable never lock.
  const lockedBy = (st, w, c) => c % 10 === 4 || (RT.reusable || []).includes(c) ? -1
    : RT.waves.findIndex((o, j) => j < w && over(st, j) && o.set.includes(c));
  const draft = {};

  const STORE = CFG.storageKey;
  const fresh = () => ({ g: STAGES.map((_, st) => COLS(st).map(() => [])), h: STAGES.map((_, st) => COLS(st).map(() => 0)), view: 0 });
  let state = fresh();
  try {
    // Keep saved stages that still fit; a stage added since the save starts empty.
    const s = JSON.parse(localStorage.getItem(STORE) || "null");
    if (s && Array.isArray(s.g)) state = { g: STAGES.map((S, st) => Array.isArray(s.g[st]) && s.g[st].length === S.cols ? s.g[st] : COLS(st).map(() => [])), view: +s.view || 0, h: STAGES.map((S, st) => Array.isArray(s.h?.[st]) && s.h[st].length === S.cols ? s.h[st] : COLS(st).map(() => 0)) };
  } catch {}
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch {} };

  const won = (st, i) => STAGES[st].kind === "route" ? state.g[st][i].some(g => solvedBy(i, g)) : state.g[st][i].includes(STAGES[st].ans[i]);
  // A hint uses up a try, so tries used = guesses + hints.
  const hintsOf = (st, i) => state.h?.[st]?.[i] || 0;
  const used = (st, i) => state.g[st][i].length + hintsOf(st, i);
  const over = (st, i) => won(st, i) || used(st, i) >= STAGES[st].max;
  const stageOver = st => COLS(st).every(i => over(st, i));
  const unlocked = st => st === 0 || stageOver(st - 1);
  const current = () => { for (let st = 0; st < STAGES.length; st++) if (!stageOver(st)) return st; return STAGES.length; };
  const verdict = (st, v, i) => {
    if (STAGES[st].kind === "route") { const gr = grade(i, v); return solvedBy(i, v) ? "hit" : gr.includes("hit") ? "near" : "miss"; }
    return v === STAGES[st].ans[i] ? "hit" : (STAGES[st].near && STAGES[st].ans.includes(v)) ? "near" : "miss";
  };
  const nameOf = (st, v) => STAGES[st].kind === "np" ? `NP${v}`
    : STAGES[st].input === "ceband" ? `${CE.get(Math.floor(v / 10)).name} · ${bandText(Math.floor(v / 10), v % 10)}`
    : STAGES[st].pool.get(v).name;

  function header() {
    document.title = CFG.title;
    const t = CFG.title.split(" ");
    $("title").innerHTML = t.length > 1 ? `${esc(t.slice(0, -1).join(" "))} <span>${esc(t[t.length - 1])}</span>` : esc(CFG.title);
    $("eyebrow").textContent = CFG.eyebrow || "";
    $("lede").textContent = CFG.lede || "";
    $("mc").innerHTML = (CFG.notes || []).map(([k, v]) => `<span>${esc(k)} <b>${esc(v)}</b></span>`).join("");
    $("footer").textContent = CFG.footer + (CFG.spriteCredit ? " " + CFG.spriteCredit : "");
    const root = document.documentElement.style;
    root.setProperty("--units", String(CFG.shown.length + N));
    root.setProperty("--hidden", String(N));
    root.setProperty("--stages", String(STAGES.length));
    if (FACES) root.setProperty("--fcols", String(FACES.cols));
  }

  function renderQuest() {
    const q = CFG.quest;
    if (!q) return;
    const fmt = n => n.toLocaleString("en-US");
    const meta = [q.event, q.ap != null ? `${q.ap} AP` : "", q.level ? `Lv ${q.level}` : ""].filter(Boolean).map(esc).join(" · ");
    const waves = q.waves.map((w, i) => `<div class="wave"><div class="wave-h"><span>Wave ${i + 1}</span><span>${fmt(w.reduce((n, e) => n + e.hp, 0))} HP</span></div>
      ${w.map(e => `<div class="enemy${e.sprite ? " has-sprite" : ""}">${e.sprite ? `<img class="e-sprite" src="${esc(e.sprite)}" alt="" width="44" height="44" loading="lazy" decoding="async">` : ""}<span class="e-name">${esc(e.name)}</span><span class="e-hp">${fmt(e.hp)}</span><span class="e-cls">${esc(e.cls)}${e.bars ? ` · ${e.bars} extra HP bar${e.bars > 1 ? "s" : ""}` : ""}</span></div>`).join("")}</div>`).join("");
    $("quest").innerHTML = `<div class="q-head"><span class="q-name">${esc(q.name)}</span><span class="q-meta">${meta}</span></div>
      ${q.notes?.length ? `<ul class="q-notes">${q.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
      <div class="waves" style="--waves:${Math.min(q.waves.length, 3)}">${waves}</div>`;
    $("quest-sec").hidden = false;
  }

  function factCell(st, i, text, pre = "") {
    if (!over(st, i)) return `<dd class="q">?</dd>`;
    return `<dd class="${won(st, i) ? "won" : "lost"}${pre ? " ce-dd" : ""}">${pre}${pre ? `<span>${esc(text)}</span>` : esc(text)}</dd>`;
  }

  function renderFormation() {
    const end = current() === STAGES.length;
    const shown = CFG.shown.map(u => `<div class="slot fixed ${u.style || ""}"><span class="tag">${esc(u.label)}</span><div class="who-row">${spriteBox(u.sprite, "s" + u.servant) || face(u.servant, 48)}<span class="name">${esc(SV.get(u.servant).name)}</span></div>
      ${u.facts?.length ? `<dl class="facts">${u.facts.map(([k, v]) => k === "CE" && ceIco(u.ce, u.ceMlb, 28)
        ? `<dt>${esc(k)}</dt><dd class="ce-dd">${ceIco(u.ce, u.ceMlb, 28)}<span>${esc(v)}</span></dd>`
        : `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}
      ${u.extra?.length ? `<ul class="extra">${u.extra.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : ""}</div>`).join("");
    const hidden = SLOTS.map((sl, i) => {
      const svNo = SERV < 0 ? sl.servant : over(SERV, i) ? STAGES[SERV].ans[i] : null;
      const sv = svNo != null ? `<div class="who-row">${spriteBox(HIDDEN_SPRITES[i], "h" + i) || face(svNo, 48)}<span class="name">${esc(SV.get(svNo).name)}</span></div>`
        : `<div class="who-row">${facePh(HIDDEN_SPRITES[i] ? 64 : 48)}<span class="name q">?</span></div>`;
      let facts = "";
      if (CES >= 0) {
        const a = STAGES[CES].ans[i], banded = STAGES[CES].input === "ceband";
        facts += `<dt>CE</dt>${factCell(CES, i, `${CE.get(ceNo(a)).name}${sl.ceDetail ? ` · ${sl.ceDetail}` : ""}`, ceIco(ceNo(a), banded && a % 10 >= 2, 28))}`;
      }
      else if (sl.ceText) facts += `<dt>CE</dt><dd>${esc(sl.ceText)}</dd>`;
      if (NPS >= 0) facts += `<dt>NP</dt>${factCell(NPS, i, `NP${STAGES[NPS].ans[i]}`)}`;
      else if (sl.npText) facts += `<dt>NP</dt><dd>${esc(sl.npText)}</dd>`;
      const extra = end && sl.extra?.length ? `<ul class="extra">${sl.extra.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : "";
      return `<div class="slot ${sl.style || ""}"><span class="tag">${esc(sl.name)}</span>${sv}${facts ? `<dl class="facts">${facts}</dl>` : ""}${extra}</div>`;
    }).join("");
    $("formation").innerHTML = shown + hidden;
    spriteInit = true;
    renderDock();
  }

  function unitFace(u, size) {
    const nShown = CFG.shown.length;
    if (u < nShown) { const s = CFG.shown[u]; return s.sprite ? `<img class="lu-img" src="${esc(s.sprite)}" alt="" width="${size}" height="${size}" decoding="async">` : face(s.servant, size); }
    const i = u - nShown, no = SERV < 0 ? SLOTS[i].servant : STAGES[SERV].ans[i];
    return HIDDEN_SPRITES[i] ? `<img class="lu-img" src="${esc(HIDDEN_SPRITES[i])}" alt="" width="${size}" height="${size}" decoding="async">` : face(no, size);
  }

  // Pinned strip: one mini card per unit, with what is known so far (portrait, CE icon, NP).
  function renderDock() {
    const mini = (img, name, ce, np, cls) => `<div class="dk ${cls}" title="${esc(name)}">${img}<span class="dk-name">${esc(name)}</span><span class="dk-meta">${ce}${np ? `<b>${esc(np)}</b>` : ""}</span></div>`;
    const dimg = (src, no) => src ? `<img class="dk-img" src="${esc(src)}" alt="" width="40" height="40" decoding="async">` : face(no, 40);
    const shown = CFG.shown.map(u => {
      const np = (u.facts || []).find(([k]) => k === "NP")?.[1] || "";
      return mini(dimg(u.sprite, u.servant), SV.get(u.servant).name.split(" (")[0], ceIco(u.ce, u.ceMlb, 18), np, "fixed");
    });
    const hidden = SLOTS.map((sl, i) => {
      const svNo = SERV < 0 ? sl.servant : over(SERV, i) ? STAGES[SERV].ans[i] : null;
      const img = svNo != null ? dimg(HIDDEN_SPRITES[i], svNo) : `<span class="dk-img dk-q" aria-hidden="true">?</span>`;
      const ce = CES >= 0 && over(CES, i) ? ceIco(ceNo(STAGES[CES].ans[i]), STAGES[CES].input === "ceband" && STAGES[CES].ans[i] % 10 >= 2, 18) : "";
      const np = NPS >= 0 && over(NPS, i) ? `NP${STAGES[NPS].ans[i]}` : "";
      return mini(img, svNo != null ? SV.get(svNo).name.split(" (")[0] : sl.short, ce, np, sl.style || "");
    });
    dockMinis = [...shown, ...hidden];
    $("dock").innerHTML = `<div class="dk-wave" id="dk-wave" hidden></div><div class="dk-row" id="dk-row"></div>`;
    renderDockTeam(dockMinis.map((_, k) => k));
    dockWave = -1;
    syncDockWave();
  }

  // ---- line-up: positions 0-2 front line, 3-5 back line; unit ids are party order (shown, then slots) ----
  const FRONT = 3;
  const startLineup = () => RT ? RT.units.map((_, k) => k) : [];
  function applyEvent(line, ev) {
    const l = line.slice(), [kind, a, b] = ev;
    if (kind === "swap") { const pa = l.indexOf(a), pb = l.indexOf(b); if (pa >= 0 && pb >= 0) [l[pa], l[pb]] = [l[pb], l[pa]]; }
    if (kind === "retreat") {
      const p = l.indexOf(a);
      if (p >= 0 && p < FRONT && l.length > FRONT) { const back = l.slice(FRONT); l[p] = back.shift(); back.push(a); l.splice(FRONT, back.length, ...back); }
    }
    return l;
  }
  // Line-up at the start of wave w: earlier waves' changes apply only while each of those waves is over,
  // so nothing about an unsolved wave leaks.
  function lineupAt(w) {
    let l = startLineup();
    const st = ROUTE;
    for (let k = 0; k < w && st >= 0; k++) { if (!over(st, k)) break; for (const ev of RT.waves[k].lineup || []) l = applyEvent(l, ev); }
    return l;
  }
  const unitName = u => RT?.units[u]?.nick || "?";
  function lineupStrip(l, moved = new Set()) {
    return `<div class="lu">${l.map((u, p) => `${p === FRONT ? '<span class="lu-sep" aria-hidden="true"></span>' : ""}<span class="lu-u${moved.has(u) ? " moved" : ""}" title="${esc(unitName(u))}">${unitFace(u, 30)}</span>`).join("")}</div>`;
  }
  // Wave card, once the wave is over: start line-up, then each change with an arrow.
  function lineupSequence(w) {
    const evs = RT.waves[w].lineup || [];
    if (!evs.length) return "";
    let l = lineupAt(w);
    let html = lineupStrip(l);
    for (const ev of evs) {
      const [kind, a, b] = ev;
      const next = applyEvent(l, ev);
      const moved = new Set(next.filter((u, p) => l[p] !== u));
      const label = kind === "swap" ? `Order Change: ${unitName(a)} ⇄ ${unitName(b)}`
        : `${unitName(a)} retreats · ${unitName(next[l.indexOf(a)])} steps in`;
      html += `<div class="lu-step"><span class="lu-arrow" aria-hidden="true">↓</span><span>${esc(label)}</span></div>` + lineupStrip(next, moved);
      l = next;
    }
    return `<span class="r-label">Line-up</span><div class="lu-seq">${html}</div>`;
  }

  // Skill-order stage: the wave card at the top of the screen picks which enemies the strip shows.
  let dockWave = -1, dockMinis = [];
  function renderDockTeam(order) {
    const row = $("dk-row");
    if (row) row.innerHTML = order.map((u, p) => (p === FRONT && order.length > FRONT ? '<span class="dk-sep" aria-hidden="true"></span>' : "") + (dockMinis[u] || "")).join("");
  }
  function syncDockWave() {
    const box = $("dk-wave");
    if (!box) return;
    const waves = CFG.quest?.waves;
    if (!waves || STAGES[state.view]?.kind !== "route") { if (dockWave !== -1 || box.hidden === false) renderDockTeam(dockMinis.map((_, k) => k)); box.hidden = true; dockWave = -1; return; }
    const cards = [...document.querySelectorAll("#cols > .col")];
    // A card counts as in view once its top passes a line a little below the strip.
    const line = ($("dock").hidden ? 0 : $("dock").offsetHeight) + Math.min(220, innerHeight * 0.3);
    let w = 0;
    cards.forEach((c, k) => { if (c.getBoundingClientRect().top <= line) w = k; });
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) w = cards.length - 1;
    w = Math.min(w, waves.length - 1);
    box.hidden = false;
    if (w === dockWave) return;
    dockWave = w;
    renderDockTeam(lineupAt(w));
    const fmt = n => n.toLocaleString("en-US");
    const total = waves[w].reduce((n, e) => n + e.hp, 0);
    box.innerHTML = `<div class="dkw-inner"><span class="dkw-label">Wave ${w + 1}<small>${fmt(total)} HP</small></span><div class="dkw-list">${waves[w].map(e => `<div class="dkw-e" title="${esc(e.name)} · ${esc(e.cls)} · ${fmt(e.hp)} HP">${e.sprite ? `<img src="${esc(e.sprite)}" alt="" width="32" height="32" decoding="async">` : ""}<span class="dkw-txt"><span class="dkw-name">${esc(e.name)}</span><span class="dkw-hp">${fmt(e.hp)}</span></span></div>`).join("")}</div></div>`;
  }

  function renderSteps() {
    $("steps").innerHTML = STAGES.map((s, st) => {
      const done = stageOver(st), open = unlocked(st);
      const solved = COLS(st).filter(i => won(st, i)).length;
      const status = done ? `Done · ${solved}/${s.cols} ${s.kind === "route" ? "waves" : "found"}` : open ? "In progress" : "Locked";
      return `<button type="button" class="step ${done ? "done" : ""}" data-st="${st}" ${open ? "" : "disabled"} ${state.view === st ? 'aria-current="step"' : ""}>
        <span class="s-n">Stage ${st + 1}</span><span class="s-t">${s.title}</span><span class="s-st">${status}</span></button>`;
    }).join("");
    $("steps").querySelectorAll(".step").forEach(b => b.onclick = () => { state.view = +b.dataset.st; save(); render(); });
  }

  const actTile = (c, cls, k, tag = "span", attrs = "") => `<${tag} class="act ${cls}" title="${esc(actName(c))}" ${attrs}>${k != null ? `<span class="n">${k + 1}</span>` : ""}${iconImg(c, "t-ico")}${esc(actLabel(c))}</${tag}>`;

  function routeColHtml(st, w) {
    const S = STAGES[st], W = RT.waves[w], gs = state.g[st][w], L = W.set.length;
    const done = over(st, w), ok = won(st, w);
    const enemies = CFG.quest?.waves?.[w];
    const sub = enemies ? `<span class="who">${enemies.length} ${enemies.length === 1 ? "enemy" : "enemies"} · ${L} actions</span>` : `<span class="who">${L} actions</span>`;
    const pips = Array.from({ length: S.max }, (_, k) => `<span class="pip ${gs[k] ? verdict(st, gs[k], w) : ""}"></span>`).join("");
    const hist = gs.map((g, k) => { const gr = grade(w, g); return `<div class="seq history-row" aria-label="Guess ${k + 1}">${g.map((c, p) => actTile(c, gr[p], p)).join("")}</div>`; }).join("");
    let body;
    if (done) {
      body = `<div class="outcome ${ok ? "won" : "lost"}">${ok ? `Solved in ${gs.length}/${S.max}` : "Out of guesses. Here's the route:"}</div>
        <span class="r-label">The route</span><div class="seq">${W.route.map((c, p) => actTile(c, "hit", p)).join("")}</div>
        ${W.note ? `<p class="r-note">${esc(W.note)}</p>` : ""}${lineupSequence(w)}`;
    } else {
      const d = draft[w] || (draft[w] = []);
      const best = new Map();
      const rank = { hit: 3, near: 2, other: 1, miss: 0 };
      gs.forEach(g => grade(w, g).forEach((v, p) => { const c = g[p]; if (!best.has(c) || rank[v] > rank[best.get(c)]) best.set(c, v); }));
      const slotsHtml = Array.from({ length: L }, (_, p) => d[p] != null
        ? actTile(d[p], "fill", p, "button", `type="button" data-rm="${p}" data-w="${w}" aria-label="Remove ${esc(actLabel(d[p]))} from position ${p + 1}"`)
        : `<span class="act blank">${p + 1}</span>`).join("");
      const btn = c => {
        const lw = lockedBy(st, w, c);
        const ico = iconImg(c, "p-ico");
        if (lw >= 0) return `<button type="button" class="locked${ico ? " has-ico" : ""}" disabled aria-label="${esc(actLabel(c))}: used in wave ${lw + 1}">${ico}<span>${actKey(c)}</span><small>Used in W${lw + 1}</small></button>`;
        return `<button type="button" class="${best.get(c) || ""}${ico ? " has-ico" : ""}" data-add="${c}" data-w="${w}" ${d.includes(c) || d.length >= L ? "disabled" : ""} aria-label="${esc(actLabel(c))}: ${esc(actName(c))}">${ico}<span>${actKey(c)}</span><small>${esc(actName(c))}</small></button>`;
      };
      const unitNo = ui => ui < CFG.shown.length ? CFG.shown[ui].servant : (SERV < 0 ? SLOTS[ui - CFG.shown.length].servant : STAGES[SERV].ans[ui - CFG.shown.length]);
      const rows = RT.units.map((u, ui) => `<div class="pal-row"><span class="who">${face(unitNo(ui), 28)}${esc(u.nick)}</span>${[1, 2, 3, 4].map(a => btn(ui * 10 + a)).join("")}</div>`).join("")
        + `<div class="pal-row"><span class="who">${esc(RT.mc.name)}</span>${[1, 2, 3].map(a => btn(90 + a)).join("")}<span class="spacer"></span></div>`;
      body = `<span class="r-label">Your route</span><div class="seq">${slotsHtml}</div>
        <div class="r-ctl"><button class="primary" type="button" data-go="${w}" ${d.length === L ? "" : "disabled"}>Submit route</button><button class="ghost" type="button" data-undo="${w}" ${d.length ? "" : "disabled"}>Undo</button><button class="ghost" type="button" data-clear="${w}" ${d.length ? "" : "disabled"}>Clear</button></div>
        <div class="msg" id="rmsg${w}" role="status"></div>
        <div class="pal" role="group" aria-label="Actions for wave ${w + 1}">${rows}</div>`;
    }
    return `<div class="col ${done ? (ok ? "won" : "lost") : ""}"><div class="col-head"><h3>Wave ${w + 1}</h3>${sub}<span class="left">${done ? "" : `${S.max - gs.length} left`}</span></div>
      <div class="pips" aria-hidden="true">${pips}</div>${gs.length ? `<div class="history">${hist}</div>` : ""}${body}</div>`;
  }

  function wireRoute(st) {
    const cols = $("cols");
    const msg = (w, t) => { const m = $("rmsg" + w); if (m) m.textContent = t; };
    const again = sel => { render(); const el = cols.querySelector(sel); if (el && !el.disabled) el.focus(); };
    cols.onclick = e => {
      const b = e.target.closest("button");
      if (!b || b.disabled) return;
      const w = +(b.dataset.w ?? b.dataset.go ?? b.dataset.undo ?? b.dataset.clear ?? 0);
      if (b.dataset.add) { draft[w].push(+b.dataset.add); again(draft[w].length === RT.waves[w].set.length ? `[data-go="${w}"]` : `[data-add="${b.dataset.add}"][data-w="${w}"]`); }
      else if (b.dataset.rm) { draft[w].splice(+b.dataset.rm, 1); again(`[data-undo="${w}"]`); }
      else if (b.dataset.undo != null) { draft[w].pop(); again(`[data-undo="${w}"]`); }
      else if (b.dataset.clear != null) { draft[w] = []; again(`[data-w="${w}"][data-add]:not(:disabled)`); }
      else if (b.dataset.go != null) {
        const g = draft[w];
        if (state.g[st][w].some(p => p.join() === g.join())) { msg(w, "You already tried that exact route."); return; }
        draft[w] = [];
        guess(st, w, g.slice());
      }
    };
  }

  function colHtml(st, i) {
    if (STAGES[st].kind === "route") return routeColHtml(st, i);
    const S = STAGES[st], sl = SLOTS[i], gs = state.g[st][i];
    const done = over(st, i), w = won(st, i);
    const known = SERV < 0 ? sl.servant : (st > SERV ? STAGES[SERV].ans[i] : null);
    const who = known ? `<span class="who li-main">${face(known, 22)}${esc(SV.get(known).name)}</span>` : "";
    const nh = hintsOf(st, i), facts = hintFacts(st, i);
    const pips = Array.from({ length: S.max }, (_, k) => `<span class="pip ${k < nh ? "hint" : gs[k - nh] != null ? verdict(st, gs[k - nh], i) : ""}"></span>`).join("");
    const hintsHtml = (nh ? `<div class="hints" aria-label="Hints">${facts.slice(0, nh).map(([k, v]) => `<span class="hint-chip">💡 ${esc(k)}: <b>${esc(v)}</b></span>`).join("")}</div>` : "")
      + (!done && nh < facts.length && used(st, i) < S.max - 1 ? `<button type="button" class="ghost hint-btn" data-hint="${i}">💡 Hint: ${esc(/^[A-Z]{2,}$/.test(facts[nh][0]) ? facts[nh][0] : facts[nh][0].toLowerCase())} (costs 1 try)</button>` : "");
    let entry;
    if (done) {
      entry = `<div class="outcome ${w ? "won" : "lost"}">${w ? `Solved in ${used(st, i)}/${S.max}${nh ? ` (${nh} hint${nh > 1 ? "s" : ""})` : ""}` : `Out of guesses. It was ${esc(nameOf(st, S.ans[i]))}.`}</div>`;
    } else if (S.input === "ceband") {
      entry = `<div class="cb-pick" role="group" aria-label="Guess the CE and level range for ${esc(sl.name)}">${S.cePool.map(no => {
        const c = CE.get(no);
        return `<div class="cb-row"><span class="who">${ceIco(no, false, 26)}<span>${esc(c.name)} <small>${c.rar}★</small></span></span>${[1, 2, 3, 4, 5].map(b => {
          const v = no * 10 + b, [lo, hi] = bandRange(no, b), tag = bandTag(b);
          if (b === 1) return `<button type="button" data-cb="${v}" data-i="${i}" ${gs.includes(v) ? "disabled" : ""} aria-label="${esc(c.name)}, not MLB">Not<small>MLB</small></button>`;
          return `<button type="button" data-cb="${v}" data-i="${i}" ${gs.includes(v) ? "disabled" : ""} aria-label="${esc(c.name)}, level ${lo} to ${hi}${tag ? `, ${tag}` : ""}">${lo}–${hi}<small>${tag === "MLB" ? `<b class="mlb-star" aria-hidden="true">★</b>MLB` : tag || "&nbsp;"}</small></button>`;
        }).join("")}</div>`;
      }).join("")}</div>`;
    } else if (S.input === "np") {
      entry = `<div class="np-pick" role="group" aria-label="Guess the NP level for ${esc(sl.name)}">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-np="${n}" data-i="${i}" ${gs.includes(n) ? "disabled" : ""}>NP${n}</button>`).join("")}</div>`;
    } else {
      entry = `<form class="entry" data-i="${i}" autocomplete="off" novalidate>
          <input id="in${i}" type="text" placeholder="Search ${S.unit}s" aria-label="Guess the ${S.unit} for ${esc(sl.name)}" role="combobox" aria-expanded="false" aria-controls="ls${i}" aria-autocomplete="list">
          <button class="primary" type="submit">Guess</button>
          <ul class="list" id="ls${i}" role="listbox" hidden></ul>
        </form><div class="msg" id="msg${i}" role="status"></div>`;
    }
    const hist = gs.length
      ? gs.map((v, k) => {
          const vd = verdict(st, v, i);
          const label = vd === "hit" ? "Correct" : vd === "near" ? "On the team, another slot"
            : S.input === "np" ? `Wrong${cmp(v, S.ans[i], "· it's higher ▲", "· it's lower ▼")}` : S.missLabel;
          const chips = S.pool ? `<div class="chips">${S.chips(S.pool.get(v), S.pool.get(S.ans[i]))}</div>`
            : S.input === "ceband" ? `<div class="chips">${S.chips(v, S.ans[i])}</div>` : "";
          return `<div class="tile ${vd}"><div class="t-top">${S.kind === "servant" ? face(v, 32) : S.input === "ceband" ? ceIco(Math.floor(v / 10), v % 10 >= 2, 32) : ""}<span class="t-name">${esc(nameOf(st, v))}</span><span class="t-n">#${k + 1}</span></div><div class="t-verdict">${label}</div>${chips}</div>`;
        }).reverse().join("")
      : `<div class="empty">No guesses for this slot yet.</div>`;
    return `<div class="col ${done ? (w ? "won" : "lost") : ""}"><div class="col-head"><h3>${esc(sl.name)}</h3>${who}<span class="left">${done ? "" : `${S.max - used(st, i)} left`}</span></div>
      <div class="pips" aria-hidden="true">${pips}</div>${hintsHtml}${entry}<div class="history">${hist}</div></div>`;
  }

  function wireSearch(st, i) {
    const form = document.querySelector(`form[data-i="${i}"]`);
    if (!form) return;
    const pool = [...STAGES[st].pool.values()];
    const input = $("in" + i), list = $("ls" + i), msg = $("msg" + i);
    let items = [], active = -1, pick = null;
    const close = () => { list.hidden = true; input.setAttribute("aria-expanded", "false"); active = -1; input.removeAttribute("aria-activedescendant"); };
    const choose = s => { pick = s.no; input.value = s.name; close(); msg.textContent = ""; if (STAGES[st].kind === "servant") say(s.no, "sel"); };
    const paint = () => {
      const used = new Set(state.g[st][i]);
      list.innerHTML = items.map((s, k) => `<li role="option" id="o${i}-${k}" class="${used.has(s.no) ? "used" : ""}" aria-selected="${k === active}" data-k="${k}"><span class="li-main">${STAGES[st].kind === "servant" ? face(s.no, 28) : ""}<span>${esc(s.name)}</span></span><small>${esc(s.sub)}</small></li>`).join("");
      if (active >= 0) { input.setAttribute("aria-activedescendant", `o${i}-${active}`); list.children[active]?.scrollIntoView({ block: "nearest" }); }
    };
    const open = () => {
      const q = norm(input.value).trim();
      if (!q) { items = []; close(); return; }
      items = pool.filter(s => s.key.includes(q)).sort((a, b) => (a.key.startsWith(q) ? 0 : 1) - (b.key.startsWith(q) ? 0 : 1)).slice(0, 40);
      active = items.length ? 0 : -1;
      list.hidden = !items.length; input.setAttribute("aria-expanded", String(!!items.length)); paint();
    };
    input.addEventListener("input", () => { pick = null; open(); });
    input.addEventListener("blur", () => setTimeout(close, 120));
    input.addEventListener("keydown", e => {
      if (list.hidden) return;
      if (e.key === "ArrowDown") { active = Math.min(items.length - 1, active + 1); paint(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { active = Math.max(0, active - 1); paint(); e.preventDefault(); }
      else if (e.key === "Enter") { if (items[active]) { choose(items[active]); e.preventDefault(); } }
      else if (e.key === "Escape") close();
    });
    list.addEventListener("mousedown", e => { const li = e.target.closest("li"); if (li) { e.preventDefault(); choose(items[+li.dataset.k]); } });
    form.addEventListener("submit", e => {
      e.preventDefault();
      if (!pick) { msg.textContent = `Type a name and pick a ${STAGES[st].unit} from the list.`; return; }
      if (state.g[st][i].includes(pick)) { msg.textContent = "You already tried that one for this slot."; return; }
      guess(st, i, pick);
      if (!over(st, i)) $("in" + i)?.focus();
    });
  }

  // ---- voice lines (servant stage): pick = card-select line, correct = victory, wrong = KO ----
  // Packs are voice/<no>.json next to the page, fetched on first use and played through Web Audio.
  const VOICES = Array.isArray(CFG.voices) ? new Set(CFG.voices) : null;
  const SOUND_KEY = CFG.storageKey + ":sound";
  let soundOn = (() => { try { return localStorage.getItem(SOUND_KEY) !== "off"; } catch { return true; } })();
  const packs = new Map(), clips = new Map();
  let actx = null, playing = null, sayTicket = 0;
  const loadPack = no => {
    if (!packs.has(no)) packs.set(no, (typeof fetch === "function" ? fetch(`voice/${no}.json`) : Promise.reject())
      .then(r => r.ok ? r.json() : null).catch(() => null));
    return packs.get(no);
  };
  async function say(no, kind) {
    // Only the most recent request may play: a slower download must not cut in after a newer click.
    const ticket = ++sayTicket;
    try { playing?.stop(); } catch {}
    if (!soundOn || !VOICES?.has(no)) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      actx = actx || new AC();
      if (actx.state === "suspended") await actx.resume();
      let buf = clips.get(no + kind);
      if (!buf) {
        const p = await loadPack(no);
        if (!p?.[kind]) return;
        buf = await actx.decodeAudioData(Uint8Array.from(atob(p[kind]), c => c.charCodeAt(0)).buffer);
        clips.set(no + kind, buf);
      }
      if (ticket !== sayTicket) return;
      try { playing?.stop(); } catch {}
      const src = actx.createBufferSource(), gain = actx.createGain();
      gain.gain.value = 0.8;
      src.buffer = buf; src.connect(gain); gain.connect(actx.destination); src.start();
      playing = src;
    } catch {}
  }
  function renderSound() {
    const b = $("sound");
    if (!VOICES || !(STAGES.some(s => s.kind === "servant") || Object.keys(CFG.ceVoices || {}).length)) return;
    b.hidden = false;
    b.setAttribute("aria-pressed", String(soundOn));
    b.textContent = soundOn ? "🔊 Voices on" : "🔇 Voices off";
    b.onclick = () => { soundOn = !soundOn; try { localStorage.setItem(SOUND_KEY, soundOn ? "on" : "off"); } catch {} if (!soundOn) { try { playing?.stop(); } catch {} } renderSound(); };
  }

  // Hints: one fact about the slot's answer per press, in a fixed order. Servant and CE stages only.
  function hintFacts(st, i) {
    const S = STAGES[st];
    if (S.kind === "servant") {
      const a = SV.get(S.ans[i]);
      return [["Class", a.cls], ["Rarity", a.rar + "★"], ["NP", a.np === "Support" ? `${a.card} support NP` : `${a.card} ${a.np} NP`]];
    }
    if (S.kind === "ce" && S.input === "ceband") {
      const no = Math.floor(S.ans[i] / 10), b = S.ans[i] % 10;
      return [["Rarity", CE.get(no).rar + "★"], ["MLB", b >= 2 ? "Yes" : "No"]];
    }
    if (S.kind === "ce") { const c = CE.get(S.ans[i]); return [["Rarity", c.rar + "★"], ["Type", c.kind]]; }
    return [];
  }
  function takeHint(st, i) {
    if (over(st, i) || used(st, i) >= STAGES[st].max - 1 || hintsOf(st, i) >= hintFacts(st, i).length) return;
    state.h[st][i] = hintsOf(st, i) + 1;
    save(); render();
    document.querySelector(`[data-hint="${i}"]`)?.focus();
  }

  function guess(st, i, v) {
    if (STAGES[st].kind === "servant") say(v, v === STAGES[st].ans[i] ? "win" : "ko");
    state.g[st][i].push(v);
    const before = state.view;
    save(); render();
    if (stageOver(st) && st < STAGES.length - 1 && before === st) {
      $("banner").innerHTML = `<div class="banner" role="status">Stage ${st + 1} complete. <button class="primary" type="button" id="next">Go to ${STAGES[st + 1].title}</button></div>`;
      $("next").onclick = () => { state.view = st + 1; save(); render(); };
    }
  }

  function shareText() {
    const out = [`${CFG.title} ${CFG.shareEmoji || ""}`.trim()];
    STAGES.forEach((S, st) => {
      if (STAGES.length > 1) out.push(S.title);
      COLS(st).forEach(i => {
        const gs = state.g[st][i];
        const sq = (S.kind === "route" ? "" : "💡".repeat(hintsOf(st, i))) + gs.map(v => ({ hit: "🟩", near: "🟨", miss: "⬛" }[verdict(st, v, i)])).join("");
        const label = S.kind === "route" ? `W${i + 1}` : SLOTS[i].short;
        out.push(`${label.padEnd(4)} ${sq} ${won(st, i) ? used(st, i) : "X"}/${S.max}`);
      });
    });
    return out.join("\n");
  }

  // CE stage: what each pool CE does, once, above the slot cards.
  function renderCeRef(st) {
    const S = STAGES[st];
    if (S.input !== "ceband" || !CFG.ceInfo) { $("ceref").innerHTML = ""; return; }
    $("ceref").innerHTML = `<details class="ceref" open><summary>What these CEs do</summary><div class="ceref-list">${S.cePool.map(no => {
      const c = CE.get(no), i = CFG.ceInfo[no] || {};
      return `<div class="ceref-item">${ceIco(no, false, 40)}<div><div class="ceref-name">${esc(c.name)} <small>${c.rar}★</small></div>
        ${i.base ? `<p>${esc(i.base)}</p>` : ""}${i.mlb ? `<p><b class="mlb-star" aria-hidden="true">★</b><b>MLB:</b> ${esc(i.mlb)}</p>` : ""}${i.event ? `<p class="ceref-ev">Event: ${esc(i.event)}</p>` : ""}</div></div>`;
    }).join("")}</div></details>`;
  }

  // End-of-game summary: why the team works, plus an optional link (e.g. a Laplace share).
  function summaryHtml() {
    const s = CFG.summary;
    if (!s) return "";
    const link = s.link?.url && /^https:\/\//.test(s.link.url) ? `<a class="sum-link" href="${esc(s.link.url)}" target="_blank" rel="noopener">${esc(s.link.label || "Open the team")} ↗</a>` : "";
    return `<div class="summary"><h4>${esc(s.title || "Why this team works")}</h4><ol>${(s.points || []).map(p => `<li>${esc(p)}</li>`).join("")}</ol>${link}</div>`;
  }

  function renderResult() {
    if (current() !== STAGES.length) { $("result").innerHTML = ""; return; }
    const total = STAGES.reduce((n, S) => n + S.cols, 0);
    const found = STAGES.reduce((n, _, st) => n + COLS(st).filter(i => won(st, i)).length, 0);
    $("result").innerHTML = `<div class="result"><h3>${found === total ? "Perfect team" : `${found} of ${total} found`}</h3>
      ${summaryHtml()}
      <p class="note" style="margin:0">The full builds are in the party above, and each wave card shows its route.</p>
      <pre id="share">${esc(shareText())}</pre>
      <div class="actions"><button class="primary" type="button" id="copy">Copy result for Reddit</button><button class="ghost" type="button" id="reset">Play again</button><span class="note" id="copymsg" role="status"></span></div></div>`;
    $("copy").onclick = () => {
      const ok = () => { $("copymsg").textContent = "Copied. Paste it in the thread."; };
      const fallback = () => { const r = document.createRange(); r.selectNodeContents($("share")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); $("copymsg").textContent = "Selected. Press Ctrl+C to copy."; };
      try { navigator.clipboard.writeText(shareText()).then(ok, fallback); } catch { fallback(); }
    };
    $("reset").onclick = () => { state = fresh(); save(); render(); };
  }

  function render() {
    if (!unlocked(state.view)) state.view = Math.min(current(), STAGES.length - 1);
    const st = state.view;
    renderFormation(); renderSteps(); renderResult();
    $("banner").innerHTML = "";
    $("key").innerHTML = STAGES[st].key + `${hintFacts(st, 0).length ? "<span>💡 A hint reveals one fact about the answer and uses up a try.</span>" : ""}<span>${STAGES[st].max} ${STAGES[st].max === 1 ? "try" : "tries"} per ${STAGES[st].kind === "route" ? "wave" : "slot"}.</span>`;
    renderCeRef(st);
    $("cols").classList.toggle("one", STAGES[st].kind === "route");
    // A search box plus its Guess button needs ~300px; past three slots, wrap the cards instead of overflowing.
    $("cols").classList.toggle("wide", STAGES[st].input === "ceband" || (STAGES[st].input === "search" && N > 3));
    $("cols").onclick = null;
    $("cols").innerHTML = COLS(st).map(i => colHtml(st, i)).join("");
    $("cols").querySelectorAll("[data-hint]").forEach(b => b.onclick = () => takeHint(st, +b.dataset.hint));
    if (STAGES[st].input === "search") IDX.forEach(i => wireSearch(st, i));
    else if (STAGES[st].input === "route") wireRoute(st);
    else if (STAGES[st].input === "ceband") $("cols").querySelectorAll("[data-cb]").forEach(b => b.onclick = () => {
      const v = +b.dataset.cb, no = CFG.ceVoices?.[Math.floor(v / 10)];
      if (no) say(no, "sel");
      guess(st, +b.dataset.i, v);
    });
    else $("cols").querySelectorAll("[data-np]").forEach(b => b.onclick = () => guess(st, +b.dataset.i, +b.dataset.np));
    dockWave = -1; syncDockWave();
  }

  header();
  // Show the strip only while the party section is scrolled out of view above.
  try {
    // Visible once the party section has scrolled fully above the top edge; checked on every scroll and resize.
    const syncDock = () => { $("dock").hidden = $("party-sec").getBoundingClientRect().bottom > 0; syncDockWave(); };
    let raf = 0;
    const queue = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; syncDock(); }); };
    addEventListener("scroll", queue, { passive: true });
    addEventListener("resize", queue);
    syncDock();
  } catch {}
  renderSound();
  renderQuest();
  render();
})();
</script>
